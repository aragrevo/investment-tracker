<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Tracker</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-input: #16162a;
      --border: #2d2d4a;
      --text: #e4e4f0;
      --text-muted: #8888a8;
      --accent: #3b82f6;
      --quanfury: #3b82f6;
      --hapi: #ef4444;
      --binance: #eab308;
      --tyba: #22c55e;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-danger {
      /* background: var(--danger); */
      border: 1px solid var(--danger);
      color: var(--danger);
      background: transparent;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .card-value.quanfury {
      color: var(--quanfury);
    }

    .card-value.hapi {
      color: var(--hapi);
    }

    .card-value.binance {
      color: var(--binance);
    }

    .card-value.tyba {
      color: var(--tyba);
    }

    .section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
    }

    th,
    td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: var(--bg);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .platform-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .platform-dot.quanfury {
      background: var(--quanfury);
    }

    .platform-dot.hapi {
      background: var(--hapi);
    }

    .platform-dot.binance {
      background: var(--binance);
    }

    .platform-dot.tyba {
      background: var(--tyba);
    }

    .growth {
      font-size: 0.85rem;
    }

    .growth.positive {
      color: #22c55e;
    }

    .growth.negative {
      color: #ef4444;
    }

    .actions {
      display: flex;
      gap: 8px;
      max-width: 120px;
    }

    .platform-header td {
      background: var(--bg);
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .badge-deposit {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }

    .badge-roi {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .badge-roi.negative {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .chart-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    canvas {
      width: 100%;
      height: 300px;
      display: block;
    }

    .legend {
      display: flex;
      gap: 24px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .legend-color {
      width: 12px;
      height: 3px;
      border-radius: 2px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
    }

    .modal h2 {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.9rem;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      th,
      td {
        padding: 10px 12px;
        font-size: 0.85rem;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>Investment Tracker</h1>
      <button class="btn" onclick="openModal()">+ Agregar</button>
    </header>

    <div class="summary" id="summary"></div>

    <div class="section">
      <div class="section-title">Quanfury, Hapi, Binance y Tyba</div>
      <div class="chart-container">
        <canvas id="chart"></canvas>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-color" style="background:#3b82f6"></div>Quanfury
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:#ef4444"></div>Hapi
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:#eab308"></div>Binance
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:#22c55e"></div>Tyba
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Registros</div>
      <table id="table">
        <thead>
          <tr>
            <th>Año</th>
            <th>Valor (USD)</th>
            <th>Depósito</th>
            <th>ROI</th>
            <th style="width: 160px;"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2 id="modalTitle">Agregar Inversión</h2>
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Plataforma</label>
        <select id="platform">
          <option value="Quanfury">Quanfury</option>
          <option value="Hapi">Hapi</option>
          <option value="Binance">Binance</option>
          <option value="Tyba">Tyba</option>
        </select>
      </div>
      <div class="form-group">
        <label>Año</label>
        <input type="number" id="year" min="2020" max="2030" value="2024">
      </div>
      <div class="form-group">
        <label>Valor (USD)</label>
        <input type="number" id="value" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Depósito (USD)</label>
        <input type="number" id="deposit" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="saveInvestment()">Guardar</button>
        <button class="btn" style="background:#333" onclick="closeModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const YEARS = [2023, 2024, 2025, 2026, 2027];
    const PLATFORMS = ['Quanfury', 'Hapi', 'Binance', 'Tyba'];
    const COLORS = { Quanfury: '#3b82f6', Hapi: '#ef4444', Binance: '#eab308', Tyba: '#22c55e' };

    let cachedData = null;

    async function getData() {
      if (cachedData) return cachedData;
      const res = await fetch('/api/investments');
      cachedData = await res.json();
      return cachedData;
    }

    async function saveData(data) {
      cachedData = data;
      await fetch('/api/investments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data }),
      });
    }

    function getPreviousValue(platform, year, data) {
      const sortedYears = YEARS.filter(y => y < year);
      for (let i = sortedYears.length - 1; i >= 0; i--) {
        const prev = data.find(d => d.platform === platform && d.year === sortedYears[i]);
        if (prev) return prev.value;
      }
      return null;
    }

    function getGrowth(data) {
      return data.map(item => {
        const prev = getPreviousValue(item.platform, item.year, data);
        const growth = prev ? ((item.value - prev) / prev * 100) : null;
        return { ...item, growth };
      }).sort((a, b) => PLATFORMS.indexOf(a.platform) - PLATFORMS.indexOf(b.platform) || b.year - a.year);
    }

    function renderSummary(data) {
      const container = document.getElementById('summary');
      container.innerHTML = PLATFORMS.map(p => {
        const latest = data
          .filter(d => d.platform === p)
          .sort((a, b) => b.year - a.year)[0];
        const colorClass = p.toLowerCase();
        return `<div class="card">
          <div class="card-label">${p} (2027)</div>
          <div class="card-value ${colorClass}">${latest ? '$' + latest.value.toLocaleString() : 'N/A'}</div>
        </div>`;
      }).join('');
    }

    function getTotalDeposit(platform, data) {
      return data
        .filter(d => d.platform === platform && d.deposit)
        .reduce((sum, d) => sum + d.deposit, 0);
    }

    function renderTable(data) {
      const tbody = document.querySelector('#table tbody');
      const enriched = getGrowth(data);
      let html = '';

      PLATFORMS.forEach(platform => {
        const platformRows = enriched.filter(item => item.platform === platform);
        if (platformRows.length === 0) return;

        const totalDeposit = getTotalDeposit(platform, data);
        const latestValue = platformRows[0].value;
        const firstValue = platformRows[platformRows.length - 1].value;
        const totalInvested = firstValue + totalDeposit;
        let platformRoi;
        if (totalInvested > 0) {
          platformRoi = ((latestValue - totalInvested) / totalInvested * 100);
        } else {
          platformRoi = null;
        }
        const roiDisplay = platformRoi !== null
          ? `<span class="badge badge-roi ${platformRoi < 0 ? 'negative' : ''}">ROI ${platformRoi >= 0 ? '+' : ''}${platformRoi.toFixed(1)}%</span>`
          : '';

        html += `<tr class="platform-header">
          <td colspan="5"><span class="platform-dot ${platform.toLowerCase()}"></span>${platform} <span class="badge badge-deposit">Depositado $${totalDeposit.toLocaleString()}</span> ${roiDisplay}</td>
        </tr>`;

        platformRows.forEach(item => {
          const depositDisplay = item.deposit ? `$${item.deposit.toLocaleString()}` : '—';
          const prev = item.growth !== null ? enriched.find(r => r.platform === item.platform && r.year === item.year - 1) : null;
          const prevValue = prev ? prev.value : null;
          const roiDisplay = prevValue !== null && item.deposit !== undefined
            ? `<span class="growth ${((item.value - prevValue - item.deposit) / (prevValue + item.deposit) * 100) >= 0 ? 'positive' : 'negative'}">${((item.value - prevValue - item.deposit) / (prevValue + item.deposit) * 100) >= 0 ? '+' : ''}${((item.value - prevValue - item.deposit) / (prevValue + item.deposit) * 100).toFixed(1)}%</span>`
            : (item.growth !== null ? `<span class="growth ${item.growth >= 0 ? 'positive' : 'negative'}">${item.growth >= 0 ? '+' : ''}${item.growth.toFixed(1)}%</span>` : '—');
          html += `<tr>
            <td style="padding-left: 32px;">${item.year}</td>
            <td>$${item.value.toLocaleString()}</td>
            <td>${depositDisplay}</td>
            <td>${roiDisplay}</td>
            <td class="actions" >
              <button class="btn btn-small" onclick="editInvestment(${item.id})">Editar</button>
              <button class="btn btn-small btn-danger" onclick="deleteInvestment(${item.id})">Eliminar</button>
            </td>
          </tr>`;
        });
      });

      tbody.innerHTML = html;
    }

    function renderChart(data) {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, rect.width, rect.height);

      const padding = { top: 20, right: 30, bottom: 40, left: 60 };
      const chartW = rect.width - padding.left - padding.right;
      const chartH = rect.height - padding.top - padding.bottom;

      const allValues = data.map(d => d.value);
      const maxValue = Math.max(...allValues) * 1.15;
      const yearCount = YEARS.length;

      ctx.strokeStyle = '#2d2d4a';
      ctx.lineWidth = 1;
      const gridLines = 5;
      for (let i = 0; i <= gridLines; i++) {
        const y = padding.top + (chartH / gridLines) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(padding.left + chartW, y);
        ctx.stroke();

        const label = Math.round(maxValue - (maxValue / gridLines) * i);
        ctx.fillStyle = '#8888a8';
        ctx.font = '11px -apple-system, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('$' + label.toLocaleString(), padding.left - 8, y + 4);
      }

      ctx.fillStyle = '#8888a8';
      ctx.font = '11px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      YEARS.forEach((year, i) => {
        const x = padding.left + (chartW / (yearCount - 1)) * i;
        ctx.fillText(year.toString(), x, rect.height - 10);
      });

      PLATFORMS.forEach(platform => {
        const platformData = YEARS.map(year => {
          const found = data.find(d => d.platform === platform && d.year === year);
          return found ? found.value : null;
        });

        ctx.strokeStyle = COLORS[platform];
        ctx.lineWidth = 2;
        ctx.beginPath();
        let started = false;

        platformData.forEach((val, i) => {
          if (val === null) return;
          const x = padding.left + (chartW / (yearCount - 1)) * i;
          const y = padding.top + chartH - (val / maxValue) * chartH;
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.stroke();

        platformData.forEach((val, i) => {
          if (val === null) return;
          const x = padding.left + (chartW / (yearCount - 1)) * i;
          const y = padding.top + chartH - (val / maxValue) * chartH;
          ctx.fillStyle = COLORS[platform];
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      });
    }

    function openModal(id = null, item = null) {
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('editId').value = id || '';
      document.getElementById('modalTitle').textContent = id ? 'Editar Inversión' : 'Agregar Inversión';
      if (item) {
        document.getElementById('platform').value = item.platform;
        document.getElementById('year').value = item.year;
        document.getElementById('value').value = item.value;
        document.getElementById('deposit').value = item.deposit || '';
      } else {
        document.getElementById('platform').value = 'Quanfury';
        document.getElementById('year').value = '2024';
        document.getElementById('value').value = '';
        document.getElementById('deposit').value = '';
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    async function saveInvestment() {
      const id = document.getElementById('editId').value;
      const platform = document.getElementById('platform').value;
      const year = parseInt(document.getElementById('year').value);
      const value = parseFloat(document.getElementById('value').value) || 0;
      const deposit = parseFloat(document.getElementById('deposit').value) || 0;

      if (!value || value < 0) {
        alert('ingresá un valor válido');
        return;
      }

      let data = await getData();
      if (id) {
        data = data.map(d => d.id == id ? { ...d, platform, year, value, deposit } : d);
      } else {
        data.push({ id: Date.now(), platform, year, value, deposit });
      }
      await saveData(data);
      closeModal();
      await refresh();
    }

    async function editInvestment(id) {
      const data = await getData();
      const item = data.find(d => d.id == id);
      if (item) openModal(id, item);
    }

    async function deleteInvestment(id) {
      if (!confirm('eliminar esta inversión?')) return;
      let data = (await getData()).filter(d => d.id != id);
      await saveData(data);
      await refresh();
    }

    async function refresh() {
      const data = await getData();
      renderSummary(data);
      renderTable(data);
      renderChart(data);
    }

    window.addEventListener('resize', async () => {
      renderChart(await getData());
    });

    refresh();
  </script>
</body>

</html>
